server:
  port: 8084

spring:
  application:
    name: fare-service
  datasource:
    url: jdbc:h2:file:./data/faredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  fare:
    base-fare: 200.0
    rate-per-km: 80.0
    rate-per-minute: 5.0

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
