name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test All Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [account-service, driver-service, ride-service, fare-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        run: |
          if [ -d "${{ matrix.service }}" ]; then
            echo "Testing ${{ matrix.service }}..."
            cd ${{ matrix.service }}
            mvn clean test
          else
            echo "Directory ${{ matrix.service }} does not exist yet (waiting for member contribution). Skipping."
          fi
